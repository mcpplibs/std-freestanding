# ⚠️ THIS PACKAGE ASKS FOR WHAT IT NEEDS RATHER THAN DECLARING IT, AND THE ONE
# DECLARATION AT THE BOTTOM IS AN EXCEPTION THAT HAS TO EARN ITSELF.
#
# It needs two things it does not own: the C++ library's headers (which ship
# with whatever toolchain mcpp resolved) and the target's C library (which mcpp
# resolves from the target's own row, exactly as it resolves the compiler). It
# ASKS for both — `mcpp::toolchain_dir()` and `mcpp::sysroot_dir()` — instead of
# declaring them. Declaring them is what bound an earlier version of this
# package to picolibc, to RISC-V and to llvm, none of which it has any business
# knowing about.
#
# ⭐ THE `[xlings] deps` AT THE BOTTOM DOES NOT NAME AN IMPLEMENTATION; IT NAMES
# A SECOND PLACE TO FIND THE SAME ONE.
#
# That is the distinction, and it is the whole justification. Declaring
# `picolibc` chose one C library out of several that could have served. Naming
# `libcxx-headers` chooses nothing: this package already reads libc++'s headers
# and libc++'s own `std/<h>.inc` export tables, and synthesises libc++'s
# `__config_site`. The declaration says only where those same files come from on
# a host whose LLVM payload did not package them.
#
# ⚠️ It is still a weakening of the rule above, and saying so is the price of
# making it. The rule would be kept intact by an mcpp API for "give me libc++'s
# headers"; there is none, and inventing one would put a standard library's name
# into the build system. Of the two, a package name in this manifest is the
# smaller thing to be wrong about.
[package]
namespace   = "mcpplibs"
name        = "std-freestanding"
version     = "0.5.0"
description = "The freestanding subset of the C++ standard library as a module — import mcpplibs.std.freestanding"
license     = "Apache-2.0"
authors     = ["mcpplibs"]
repo        = "https://github.com/mcpplibs/std-freestanding"

# ── The allocating half of the subset ────────────────────────────────────────
#
# ⚠️ `alloc` DOES NOT CHANGE WHAT COMPILES. All 103 headers are included
# unconditionally and `std::vector` compiles today; what fails is the LINK,
# because a freestanding target has no compiled libc++ and therefore no
# `operator new`. The feature is a switch over what links, not over what exists.
#
#   needs nothing   array span optional expected atomic string_view ranges
#                   algorithm bit charconv concepts type_traits tuple utility
#   needs `alloc`   vector string deque list map set unordered_* function any
#                   make_unique, and the default coroutine frame
#
# `operator new` is a whole-program singleton, so the implementation is a
# separate package and the choice belongs to the program. `alloc` states the
# requirement; `alloc-kal` and `alloc-libc` each state it AND bring an
# implementation, so the ordinary consumer writes one feature and nothing else.
#
# Two providers in one graph are reported when the graph resolves, naming both
# packages — which is the reason for the indirection, since two definitions
# reaching the link produce a duplicate symbol that names a mangled operator.
[features]
default    = []
alloc      = { requires = ["freestanding-allocator"] }
alloc-kal  = { implies = ["alloc"] }
alloc-libc = { implies = ["alloc"] }

# ── The subset on a target with no C library ─────────────────────────────────
#
# ⭐ MEASURED: with this feature active, **94 of the 103** headers below compile
# for a target whose `[target.<triple>].sysroot` is empty. Without it, 15 of the
# 21 most-used ones do.
#
# The obstacle is not that the subset wants a C library. libc++ ships WRAPPERS
# for the C headers — `include/c++/v1/string.h` and its siblings — which reach
# the real header through `#include_next` to obtain `size_t`, `mbstate_t`,
# `time_t` and `EOF`. With no C library the chain has nothing to continue to,
# and the wrapper fails on a missing TYPE rather than a missing header, which is
# why the cause is not obvious from the error.
#
# ⚠️ The feature exists because a dependency cannot do this for itself:
# `include-dir` is package-private, so `std-freestanding-nolibc` can only use
# its own headers. This package asks mcpp where that package landed and adds
# the directory to ITS OWN compile, after libc++'s — see build.mcpp for why the
# order is load-bearing.
nolibc     = {}

# Resolved only when the corresponding feature is active, so this package
# carries no dependency on either implementation and a consumer that uses only
# the non-allocating half pulls neither.
#
# ⚠️ `"^0.1.0"`, and getting here took three attempts. The two that failed are
# worth recording, because each was defeated by a criterion that was too weak.
#
#   0.3.0  `"0.1.x"`  — copied from the documented `[feature-deps]` example.
#                       The literal reaches the installer, which has no such
#                       selector: `E_NOT_FOUND`, naming the PACKAGE.
#   0.3.1  `"0.1"`    — chosen because it did not produce `E_NOT_FOUND`. It
#                       resolves and then fails one step later with
#                       `install path missing after fetch`.
#
# ⭐ "No E_NOT_FOUND" is not the same as "installs", and "installs" is not the
# same as "builds". The criterion that settles it is a BUILD against the real
# index; measured for `0.1.0`, `^0.1.0`, `^0.1` and `>=0.1.0, <0.2.0`, all of
# which fetch, while a bare two-segment `0.1` does not.
#
# None of this was visible in development, because every local test used a path
# dependency — and a path dependency never consults the index. A feature whose
# implementation cannot be fetched is a feature that does not exist.
[feature-deps.alloc-kal]
std-freestanding-alloc-kal = "^0.1.0"

[feature-deps.alloc-libc]
std-freestanding-alloc-libc = "^0.1.0"

[feature-deps.nolibc]
std-freestanding-nolibc = "^0.2.0"

# ── The second place the headers can come from ──────────────────────────────
#
# ⚠️ DECLARED SO THAT `build.mcpp` CAN ASK WHERE IT LANDED, NOT SO THAT IT GETS
# INSTALLED. `mcpp::xpkg_dir` answers only for a package the OWNING manifest
# declares, and a `[xlings] deps` entry is a declaration rather than an install
# trigger — a distinction this ecosystem has been bitten by once already, in a
# template whose generated project built on three machines and ran on none.
#
# Installation comes from the other channel: this package's INDEX descriptor
# names `xim:libcxx-headers` under the platform whose LLVM payload ships no
# libc++, and an index descriptor's platform `deps` ARE installed with the
# package.
#
# ⭐ Declaring it unconditionally costs nothing where it is not needed.
# `build.mcpp` consults the toolchain payload first and reaches this package
# only when the payload carries no `include/c++/v1`; on Linux and macOS the
# fallback is never taken and the compile line is byte-for-byte what it was.
[xlings]
deps = ["libcxx-headers"]

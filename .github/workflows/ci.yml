name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: subset compiles, runs in qemu, and omits what it must
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MCPP_VERSION: 2026.8.20.2
      XLINGS_VERSION: v2026.8.17.2
      XLINGS_NON_INTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install mcpp
        run: |
          # ⚠️ A LOOP, BECAUSE ONE `xlings update` CAN RETURN A STALE INDEX
          # WITHOUT SAYING SO.
          #
          # The index is published as an artifact behind a pointer, and that
          # pointer propagates asynchronously after a version bump is merged.
          # Measured on release day: an update run four minutes after the merge
          # printed `index updated`, and the install then failed with
          #
          #     package 'mcpp@<ver>' not found in the synced index
          #     (xim@artifact:<an older sha>, ...), synced 0 seconds ago
          #
          # Nothing had gone wrong. The update fetched the PREVIOUS artifact,
          # and "synced 0 seconds ago" describes when it was fetched rather than
          # what it contains — which is why the message reads as freshness.
          #
          # So this is not a retry around flakiness; it is the wait that a
          # single update does not perform. A pin naming a version that was
          # never published still fails, after the last attempt, and says which
          # of the two situations it is.
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            if [ "$attempt" = 6 ]; then
              echo "::error::mcpp@$MCPP_VERSION never appeared in the index (6 attempts over 5 minutes). If it was just released, the pointer has not propagated; if the pin names a version that was never published, it never will."
              exit 1
            fi
            echo "the index has not caught up yet (attempt $attempt of 6); waiting 60s"
            sleep 60
          done
          mcpp --version
          mcpp self config --mirror GLOBAL

      - name: Install the target world
        run: |
          # Both homes: the shim on PATH dispatches against whichever home owns
          # it, while mcpp starts the runner through its own.
          xlings install xim:qemu-riscv -y
          XLINGS_HOME="$HOME/.mcpp/registry" xlings install xim:qemu-riscv -y
          # ⚠️ NOT picolibc: mcpp installs the target's C library itself.

      # ⚠️ THIS STEP EXISTS BECAUSE THE ONE BELOW NEEDS A C LIBRARY ON DISK, AND
      # THE ONE BELOW WAS RED FROM 0.2.0 UNTIL IT WAS ADDED.
      #
      # mcpp resolves the target's C library from the target's own row and
      # installs it LAZILY, during a build. The regeneration check runs before
      # any build has happened, so it looked for a directory nothing had created
      # yet and died on `ls: cannot access`. The comment above ("mcpp installs
      # the target's C library itself") was true and was read as meaning the
      # check needed nothing — it needed the install to have HAPPENED.
      #
      # A build of the examples is the cheapest way to make that true, and it
      # exercises the package on the way.
      # ⚠️ TWICE, AND THE FIRST IS ALLOWED TO FAIL. The lazy install happens
      # DURING a build, so the first build on a machine that has never targeted
      # this triple compiles sources needing the C library's headers before they
      # exist — measured: `'inttypes.h' file not found`, and `'stdio.h' file not
      # found` inside the board package. The second build has them.
      #
      # A single build was enough while this ran on a warm runner image; it
      # stopped being enough, and the failure named headers rather than the
      # install that had not happened yet.
      # ⚠️ THE INDEX EDGE DOES NOT COVER THIS BUILD, AND THE DIFFERENCE IS THE
      # WHOLE REASON THIS STEP EXISTS.
      #
      # `riscv-virt-rt`'s index descriptor names `xim:picolibc-riscv` in its
      # platform `deps`, so a CONSUMER installing that package gets the target's
      # C library with it — measured by taking both away and watching them come
      # back. That edge fires when the PACKAGE is installed, and a repository
      # testing itself builds from its working tree, where nothing is installed
      # and nothing fires.
      #
      # So the self-build has to be given what a consumer is given. This is not
      # the workaround the comment it replaced described: mcpp genuinely does
      # not install a target's C library — it only looks one up on disk — and
      # the install-time edge in the index is where that gap is closed for
      # everyone except a repository building itself.
      - name: Install the target C library (the index edge covers consumers, not this)
        run: |
          xlings install xim:picolibc-riscv -y
          XLINGS_HOME="$HOME/.mcpp/registry" xlings install xim:picolibc-riscv -y

      - name: Make the target world exist (mcpp installs it lazily)
        run: |
          (cd examples/probe && mcpp build) || true
          (cd examples/probe && mcpp build)

      # ⚠️ THE CONFORMANCE CLAIM, AND IT IS A DIFFERENT CLAIM FROM THE ONE
      # BELOW IT.
      #
      # The next step measures how many of libc++'s 110 headers compile for the
      # target — a number about libc++. This one asserts that every header the
      # STANDARD requires of a freestanding implementation is among the ones
      # this package provides, which is a claim about conformance and is the one
      # a reader of the package name would assume.
      #
      # They can diverge silently: the export table is generated by compiling
      # libc++'s headers and keeping what works, so a toolchain change that
      # broke `<charconv>` would lower the headline number by one and quietly
      # remove a mandated header. The list is data in `tools/` so that the
      # requirement is reviewable rather than encoded in a script.
      # ⚠️ THE C++26 GUARD, ASSERTED ON BOTH SIDES — otherwise it is 42 lines
      # that do nothing and nobody would notice.
      #
      # The rule the generator emits is deliberately asymmetric: a feature-test
      # macro that is PRESENT and below the standard's value excludes the
      # header; a macro that is ABSENT does not. Measured 2026-08-20, libc++
      # 22.1.8 defines none of these macros and libstdc++ 16.1.0 defines seven,
      # and neither defines `__cpp_lib_freestanding_feature_test_macros` — so
      # absence cannot be read as "not freestanding", and gating on presence
      # would empty this package on the implementation it is built for.
      - name: The C++26 freestanding guard excludes only when told to
        run: |
          set -euo pipefail
          CL="$(find "$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm" -name 'clang++' | head -1)"
          cat > /tmp/guard.cpp <<'EOF'
          #if !defined(__cpp_lib_freestanding_optional) || __cpp_lib_freestanding_optional >= 202311L
          #define INCLUDED 1
          #else
          #define INCLUDED 0
          #endif
          static_assert(INCLUDED == EXPECT, "guard did not behave as documented");
          int main(){}
          EOF
          check() {   # $1 = macro definition or empty, $2 = expected INCLUDED
            "$CL" --no-default-config -std=c++23 -fsyntax-only $1 -DEXPECT=$2 /tmp/guard.cpp \
              || { echo "guard wrong for [$1], expected INCLUDED=$2"; exit 1; }
          }
          check ""                                          1   # no opinion -> keep
          check "-D__cpp_lib_freestanding_optional=202311L"  1   # says yes    -> keep
          check "-D__cpp_lib_freestanding_optional=202502L"  1   # says newer  -> keep
          check "-D__cpp_lib_freestanding_optional=202300L"  0   # says no     -> drop
          echo "the guard keeps on absence and on assent, and drops only on refusal"

          # And the guard is actually IN the module, for every header the
          # standard gives a macro. A generator that stopped emitting them would
          # pass every check above.
          n="$(grep -c '__cpp_lib_freestanding_' src/std_freestanding.cppm)"
          [ "$n" -ge 40 ] || { echo "expected the module to carry the guards; found $n lines"; exit 1; }
          echo "the module carries $n guard lines"

      - name: Every header the standard mandates is provided
        run: |
          set -euo pipefail
          grep -vE '^#|^$' tools/freestanding-mandated.txt | sort > /tmp/mandated.txt
          grep -oE '^#include <[a-z_]+>' src/std_freestanding.cppm \
            | sed 's/#include <//;s/>//' | sort > /tmp/provided.txt
          missing="$(comm -23 /tmp/mandated.txt /tmp/provided.txt)"
          if [ -n "$missing" ]; then
            echo "::error::the module does not provide these freestanding-mandated headers:"
            echo "$missing"
            exit 1
          fi
          echo "all $(wc -l < /tmp/mandated.txt) mandated headers are provided, out of $(wc -l < /tmp/provided.txt) in the module"

      - name: The header list is MEASURED, and still holds
        run: |
          LLVM=""
          for d in "$HOME"/.mcpp/registry/data/xpkgs/xim-x-llvm/*/; do
            [ -x "$d/bin/clang++" ] && LLVM="${d%/}"
          done
          PICO="$(ls -d "$HOME"/.mcpp/registry/data/xpkgs/xim-x-picolibc-riscv/*/ 2>/dev/null | tail -1)"
          test -n "$PICO" || { echo "the target C library was never installed — the step above did not run a build"; exit 1; }
          tools/regenerate.sh "$LLVM" "${PICO%/}" | tee regen.log
          # ⚠️ Two-sided. A drop in the count means the toolchain moved; a
          # "HOST OK" line means a header regressed on the TARGET only, which
          # is the case worth failing for.
          grep -q 'compiles for rv64gc/lp64d: 103 / 110' regen.log
          ! grep -q 'HOST OK' regen.log
          # Regenerating must be a no-op on a committed tree.
          git diff --exit-code src/std_freestanding.cppm

      # ⚠️ THE CRITERION IS THE COUNT, NOT "IT BUILT".
      #
      # The `nolibc` feature exists to make the subset usable where there is no
      # C library. A build that succeeded because the feature quietly did
      # nothing would be indistinguishable from one where it worked, so the
      # check compiles the headers one at a time on a target whose sysroot is
      # empty and asserts how many succeed. A drop means a shim regressed; a
      # rise means the exclusion list is stale.
      - name: The subset compiles on a target with NO C library — 94 of 103
        run: |
          set -euo pipefail
          rm -rf /tmp/zl && mkdir -p /tmp/zl/src
          cat > /tmp/zl/mcpp.toml <<'EOF'
          [package]
          name    = "zl"
          version = "0.1.0"
          [build]
          target = "riscv64-none-elf"
          [target.riscv64-none-elf]
          sysroot = ""
          [dependencies]
          std-freestanding = { path = "PLACEHOLDER", features = ["nolibc"] }
          EOF
          sed -i "s|PLACEHOLDER|$GITHUB_WORKSPACE|" /tmp/zl/mcpp.toml
          cat > /tmp/zl/src/main.cpp <<'EOF'
          import mcpplibs.std.freestanding;
          static volatile unsigned char* const U =
              reinterpret_cast<unsigned char*>(0x10000000);
          extern "C" void _start() {
              std::array<int, 5> a{5, 3, 1, 4, 2};
              std::ranges::sort(a, std::greater<>{});
              for (int v : a) *U = static_cast<unsigned char>('0' + v);
              *U = '\n';
              std::string_view sv{"zero-libc std ok"};
              for (char c : sv) *U = static_cast<unsigned char>(c);
              *U = '\n';
              for (;;) {}
          }
          EOF
          (cd /tmp/zl && mcpp build --target riscv64-none-elf 2>&1 | tail -3)
          echo "the module itself compiles with no C library beneath it"

          # And the per-header count, which is what the number in the manifest claims.
          ok=0; bad=0
          for h in $(grep -oE '^#include <[a-z_]+>' src/std_freestanding.cppm \
                     | sed 's/#include <//;s/>//'); do
            printf '#include <%s>\nextern "C" void _start(){for(;;){}}\n' "$h" \
              > /tmp/zl/src/main.cpp
            if (cd /tmp/zl && mcpp build --target riscv64-none-elf >/dev/null 2>&1)
            then ok=$((ok+1)); else bad=$((bad+1)); fi
          done
          echo "zero-libc: $ok compile, $bad do not"
          test "$ok" -ge 94 || { echo "expected at least 94"; exit 1; }

      - name: It runs on the target
        working-directory: examples/probe
        run: |
          mcpp run 2>&1 | tee run.log
          grep -q 'abcd'       run.log     # ranges::sort with a projection
          grep -q 'atomic 42'  run.log     # optional + atomic
          grep -q 'span+string_view / 4' run.log

      - name: And it omits what it must
        working-directory: examples/probe
        run: |
          cat > src/main.cpp <<'EOF'
          import mcpplibs.std.freestanding;
          extern "C" int main() { std::mutex m; (void)m; return 0; }
          EOF
          if mcpp build > mutex.log 2>&1; then
            cat mutex.log; echo "std::mutex compiled on a target with no threads"; exit 1
          fi
          grep -qi mutex mutex.log

  # ---------------------------------------------------------------------------
  # The cross-compilation is performed FROM three systems, not only from Linux.
  #
  # Every target in this repository is a cross target, which makes the host a
  # separate axis from the target: the compiler, the target C library and the
  # emulator are payloads mcpp resolves for whichever system it is running on.
  # A package that has only ever been built from Linux is a package whose
  # consumers must use Linux, and nothing in these sources says so.
  #
  # ⚠️ A TOOLCHAIN AXIS IS ABSENT HERE, AND THAT IS MEASURED RATHER THAN
  # ASSUMED. The row for a bare-metal triple names its compiler, and the
  # command-line override does not displace it: `--toolchain gcc@16.1.0` on a
  # `riscv64-none-elf` build resolves llvm@22.1.8 regardless. A matrix over
  # compiler families would therefore run the same compiler on every row and
  # report coverage it does not have. The toolchain axis belongs where the
  # choice is real — openkal, whose declarations are compiled by three families
  # on three systems.
  #
  # ⚠️ BUILD ONLY, AND DELIBERATELY. Behaviour is asserted once, above, under an
  # emulator. Booting the same image from three systems would be a statement
  # about the emulator rather than about this package, and "the image does what
  # the README says" does not become more true for having been observed from
  # macOS.
  portability:
    name: cross-builds from ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      MCPP_VERSION: 2026.8.20.2
      XLINGS_VERSION: v2026.8.17.2
      XLINGS_NON_INTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          # The installer amends the user's environment; no later step in this
          # job reads it back, so the directory is named here.
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install mcpp
        run: |
          # ⚠️ A LOOP, BECAUSE ONE `xlings update` CAN RETURN A STALE INDEX
          # WITHOUT SAYING SO.
          #
          # The index is published as an artifact behind a pointer, and that
          # pointer propagates asynchronously after a version bump is merged.
          # Measured on release day: an update run four minutes after the merge
          # printed `index updated`, and the install then failed with
          #
          #     package 'mcpp@<ver>' not found in the synced index
          #     (xim@artifact:<an older sha>, ...), synced 0 seconds ago
          #
          # Nothing had gone wrong. The update fetched the PREVIOUS artifact,
          # and "synced 0 seconds ago" describes when it was fetched rather than
          # what it contains — which is why the message reads as freshness.
          #
          # So this is not a retry around flakiness; it is the wait that a
          # single update does not perform. A pin naming a version that was
          # never published still fails, after the last attempt, and says which
          # of the two situations it is.
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            if [ "$attempt" = 6 ]; then
              echo "::error::mcpp@$MCPP_VERSION never appeared in the index (6 attempts over 5 minutes). If it was just released, the pointer has not propagated; if the pin names a version that was never published, it never will."
              exit 1
            fi
            echo "the index has not caught up yet (attempt $attempt of 6); waiting 60s"
            sleep 60
          done
          mcpp --version
          mcpp self config --mirror GLOBAL

      # ⚠️ TWICE, AND THE FIRST IS ALLOWED TO FAIL — every row of this matrix is
      # a machine that has never targeted this triple, which is where mcpp's
      # lazy install of the toolchain payload shows.
      #
      # ⚠️ AND THE WINDOWS ROW ASSERTS A DIAGNOSTIC RATHER THAN A BUILD, WHICH
      # IS A CONCESSION AND IS RECORDED AS ONE.
      #
      # The freestanding subset is defined by the C++ standard, and every
      # implementation provides one — so nothing about a cross build to
      # `riscv64-none-elf` should depend on the host. This package, however, is
      # libc++'s subset specifically: it synthesises libc++'s `__config_site`
      # and reads libc++'s headers. On Windows the LLVM payload ships clang
      # against the MSVC standard library and carries no libc++, so the package
      # cannot work there yet.
      #
      # Deleting the row would report coverage this package does not have.
      # Asserting the diagnostic keeps the gap visible AND retires itself: the
      # day a second backend or a libc++-carrying Windows payload arrives, this
      # step fails and says so, instead of being forgotten.
      # ⚠️ TWICE, AND THE FIRST IS ALLOWED TO FAIL — every row of this matrix is
      # a machine that has never targeted this triple, which is where mcpp's
      # lazy install of the toolchain payload shows.
      #
      # ⚠️ AND THE WINDOWS ROW MEASURES A PAYLOAD RATHER THAN BUILDING.
      #
      # The Windows LLVM payload builds clang against the MSVC standard library
      # for Windows-hosted work and ships no libc++, which also removes libc++
      # from the cross-compilations that payload could otherwise serve. That is a
      # packaging gap: libc++'s headers are host-independent text, and the same
      # clang reads them identically on every host.
      #
      # Deleting the row would report coverage this package does not have.
      # Asserting a message would be this file claiming a fact. Reporting what
      # the payload CONTAINS is neither — it is the measurement, in the log, on
      # the machine that can make it, and it retires itself: when the payload
      # gains libc++ the build succeeds and this step says the note is stale.
      - name: The subset cross-builds
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "── what this payload actually carries ──"
            for d in "$HOME"/.mcpp/registry/data/xpkgs/xim-x-llvm/*/; do
              echo "payload: $d"
              ls "$d/include" 2>/dev/null | head -20 || echo "  (no include/)"
              echo "  include/c++ :"; ls -d "$d"/include/c++/v1 2>/dev/null || echo "    absent"
              echo "  share/libc++:"; ls -d "$d"/share/libc++/v1 2>/dev/null || echo "    absent"
            done
            if mcpp build --target riscv64-none-elf > out.log 2>&1; then
              echo "::error::the subset now builds from Windows — the payload has gained libc++, and the notes in README.md and build.mcpp are out of date"
              exit 1
            fi
            grep -q "carries no" out.log || {
              cat out.log
              echo "the failure was not the documented packaging gap; something else is wrong"
              exit 1; }
            echo "measured: this payload has no libc++ headers, which is the documented gap"
            exit 0
          fi
          mcpp build --target riscv64-none-elf || true
          mcpp build --target riscv64-none-elf

  # ---------------------------------------------------------------------------
  # The features, each with the outcome it is supposed to produce.
  #
  # ⚠️ A MATRIX THAT ONLY BUILDS WOULD ASSERT ALMOST NOTHING HERE. `alloc` does
  # not change what COMPILES — all 103 headers are included unconditionally and
  # `std::vector` type-checks whether or not an allocator exists. What it
  # changes is what LINKS. So every row below states the outcome it expects, and
  # the row that expects a failure is the one that carries the design: without
  # an allocator the link must fail, and it must fail NAMING the feature that
  # fixes it, because "undefined symbol: operator new" on a bare-metal target is
  # not a sentence a reader can act on.
  #
  # The package under test is the working tree, by path. Its `[feature-deps]`
  # still resolve from the real index — which is the half that matters, since a
  # feature whose implementation cannot be fetched is a feature that does not
  # exist, and every local test using a path dependency is exactly how that went
  # unnoticed through two published versions.
  features:
    name: feature ${{ matrix.label }} -> ${{ matrix.expect }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'none',       spec: '',                      expect: 'link fails, naming the feature' }
          - { label: 'alloc-libc', spec: ', features = ["alloc-libc"]', expect: 'links and runs' }
          - { label: 'alloc-kal',  spec: ', features = ["alloc-kal"]',  expect: 'links and runs' }
          - { label: 'nolibc',     spec: ', features = ["nolibc"]',     expect: 'compiles with no C library' }
    env:
      MCPP_VERSION: 2026.8.20.2
      XLINGS_VERSION: v2026.8.17.2
      XLINGS_NON_INTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install mcpp
        run: |
          # ⚠️ A LOOP, BECAUSE ONE `xlings update` CAN RETURN A STALE INDEX
          # WITHOUT SAYING SO.
          #
          # The index is published as an artifact behind a pointer, and that
          # pointer propagates asynchronously after a version bump is merged.
          # Measured on release day: an update run four minutes after the merge
          # printed `index updated`, and the install then failed with
          #
          #     package 'mcpp@<ver>' not found in the synced index
          #     (xim@artifact:<an older sha>, ...), synced 0 seconds ago
          #
          # Nothing had gone wrong. The update fetched the PREVIOUS artifact,
          # and "synced 0 seconds ago" describes when it was fetched rather than
          # what it contains — which is why the message reads as freshness.
          #
          # So this is not a retry around flakiness; it is the wait that a
          # single update does not perform. A pin naming a version that was
          # never published still fails, after the last attempt, and says which
          # of the two situations it is.
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            if [ "$attempt" = 6 ]; then
              echo "::error::mcpp@$MCPP_VERSION never appeared in the index (6 attempts over 5 minutes). If it was just released, the pointer has not propagated; if the pin names a version that was never published, it never will."
              exit 1
            fi
            echo "the index has not caught up yet (attempt $attempt of 6); waiting 60s"
            sleep 60
          done
          mcpp self config --mirror GLOBAL

      - name: Install the emulator
        run: |
          xlings install xim:qemu-riscv -y
          XLINGS_HOME="$HOME/.mcpp/registry" xlings install xim:qemu-riscv -y

      # A consumer, because a feature is a statement about consumers. The board
      # supplies the entry point, the console and — for the `alloc-kal` row —
      # the openkal implementation the allocator calls into.
      - name: A consumer that allocates
        run: |
          mkdir -p /tmp/c/src
          cat > /tmp/c/mcpp.toml <<EOF
          [package]
          name    = "c"
          version = "0.1.0"

          [dependencies]
          riscv-virt-rt    = { version = "0.4.1", features = ["openkal"] }
          std-freestanding = { path = "$GITHUB_WORKSPACE"${{ matrix.spec }} }
          EOF
          cat > /tmp/c/src/main.cpp <<'EOF'
          import mcpplibs.riscv_virt_rt;
          import mcpplibs.std.freestanding;
          // ⚠️ extern "C". On a freestanding target `main` is not the reserved
          // function it is in a hosted one, so an ordinary definition is
          // mangled to `_Z4mainv` and the C library's crt0 does not find it.
          extern "C" int main() {
              std::vector<int> v;
              for (int i = 1; i <= 4; ++i) v.push_back(i * 7);
              board::printf("features vector %zu last=%d\n", v.size(), v.back());
              return 0;
          }
          EOF

      - name: The outcome this row expects
        working-directory: /tmp/c
        run: |
          case '${{ matrix.label }}' in
            none)
              # The negative row. A pass here means the link failed AND said
              # something a reader can act on.
              if mcpp run --target riscv64-none-elf > out.log 2>&1; then
                cat out.log
                echo "a program that allocates linked with no allocator selected"; exit 1
              fi
              grep -qi 'operator new' out.log
              grep -q  'std-freestanding' out.log
              grep -q  'alloc-kal'        out.log
              echo "the link failed and named the feature that fixes it"
              ;;
            alloc-libc|alloc-kal)
              mcpp run --target riscv64-none-elf 2>&1 | tee out.log
              grep -q 'features vector 4 last=28' out.log
              ;;
            nolibc)
              # The two-sided criterion for this feature: with it the subset
              # compiles against no C library, and without it the same source
              # in the same project does not. One side alone would pass on a
              # project that never declined the C library in the first place.
              mkdir -p /tmp/z/src
              cat > /tmp/z/mcpp.toml <<EOF
              [package]
              name    = "z"
              version = "0.1.0"

              [target.riscv64-none-elf]
              sysroot = ""

              [dependencies]
              std-freestanding = { path = "$GITHUB_WORKSPACE", features = ["nolibc"] }
          EOF
              cat > /tmp/z/src/main.cpp <<'EOF'
              import mcpplibs.std.freestanding;
              extern "C" void _start() { std::array<int, 4> a{}; (void)a; for(;;){} }
          EOF
              (cd /tmp/z && mcpp build --target riscv64-none-elf)

              sed -i 's/, features = \["nolibc"\]//' /tmp/z/mcpp.toml
              if (cd /tmp/z && mcpp build --target riscv64-none-elf > /tmp/z/without.log 2>&1); then
                cat /tmp/z/without.log
                echo "the subset compiled with no C library and no nolibc feature"; exit 1
              fi
              echo "with the feature it compiles; without it, it does not"
              ;;
          esac
